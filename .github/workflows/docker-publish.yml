name: Build and Publish IndexTTS2 vLLM Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Docker Hub image name"
        required: true
        default: "linglambda/index-tts"
      image_tag:
        description: "Primary image tag"
        required: true
        default: "vllm-cu"
      base_image:
        description: "Base vLLM image"
        required: true
        default: "docker.1ms.run/vllm/vllm-openai:v0.16.0"
      pip_index_url:
        description: "Python package index used during build"
        required: true
        default: "https://mirrors.ustc.edu.cn/pypi/simple"

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest-vllm-cu
            type=sha,prefix=${{ inputs.image_tag }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.vllm
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            PIP_INDEX_URL=${{ inputs.pip_index_url }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
